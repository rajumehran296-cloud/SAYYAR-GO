name: SAYYAR GO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Project
        run: flutter create --platforms=android .

      - name: Setup Firebase
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          if not settings.exists():
              settings = Path("android/settings.gradle.kts")

          app = Path("android/app/build.gradle")
          if not app.exists():
              app = Path("android/app/build.gradle.kts")

          s = settings.read_text()
          if "com.google.gms.google-services" not in s:
              if settings.suffix == ".kts":
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                      1
                  )
              else:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                      1
                  )
              settings.write_text(s)

          a = app.read_text()
          if "com.google.gms.google-services" not in a:
              if app.suffix == ".kts":
                  a = a.replace("plugins {", 'plugins {\n    id("com.google.gms.google-services")', 1)
              else:
                  a = a.replace("plugins {", 'plugins {\n    id "com.google.gms.google-services"', 1)
              app.write_text(a)
          PY

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAYYAR-GO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
