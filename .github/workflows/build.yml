name: SAYYAR GO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Project
        run: flutter create --platforms=android --org com.sayyar .

      - name: Setup Firebase
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

          sed -i "s/applicationId = \"com.example.sayyar_go\"/applicationId = \"com.sayyar.driver\"/" android/app/build.gradle.kts
          sed -i "s/applicationId \"com.example.sayyar_go\"/applicationId \"com.sayyar.driver\"/" android/app/build.gradle

          sed -i "s/namespace = \"com.example.sayyar_go\"/namespace = \"com.sayyar.driver\"/" android/app/build.gradle.kts
          sed -i "s/namespace \"com.example.sayyar_go\"/namespace \"com.sayyar.driver\"/" android/app/build.gradle

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAYYAR-GO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
